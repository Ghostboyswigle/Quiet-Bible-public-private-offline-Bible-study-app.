<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#141311" />
    <title>Quiet Bible</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div id="root">
      <p style="color:#c9c2b5;font-family:sans-serif;padding:24px">Opening Quiet Bible…</p>
    </div>
    <script>
      (function () {
        var orig = window.fetch;
        window.fetch = function (url, opts) {
          try {
            if (window.QuietBibleAssets && typeof window.QuietBibleAssets.read === "function") {
              var raw = String(url == null ? "" : url);
              var path = raw.replace(/^https?:\/\/[^/]+/, "").replace(/^\.\//, "").replace(/^\//, "");
              if (path.indexOf("bible/") === 0) {
                var text = window.QuietBibleAssets.read(path);
                if (text != null) {
                  return Promise.resolve(new Response(text, { status: 200, headers: { "Content-Type": "application/json" } }));
                }
              }
            }
          } catch (e) {}
          return orig.apply(this, arguments);
        };
      })();
    </script>
    <script src="./app.js"></script>
  </body>
</html>
